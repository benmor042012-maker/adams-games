<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1D5E73">
<meta name="description" content="סריג – לומדים גיטרה מאפס, בחינם">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="סריג">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>סריג גיטרה</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=Karantina:wght@700&display=swap">
<style>
/* Layout: one-column phone app — library stack, player built around a fretboard-like chord timeline, fixed bottom tab bar */
:root{
  --bg:#F2F4F5; --surface:#FFFFFF; --surface-2:#E6EBED; --ink:#162127; --ink-2:#56646B; --line:#D2D9DC;
  --accent:#1D5E73; --accent-ink:#FFFFFF; --accent-soft:#D7E7EC;
  --brass:#A8730F; --brass-soft:#F3E4C4;
  --good:#2C7A4B; --warn:#A8650A; --bad:#B23A30;
  --band-a:#DCE6EA; --band-b:#EEF2F3; --wave:#9AAAB2;
  --f-display:"Karantina","IBM Plex Sans Hebrew",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Hebrew",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
  --f1:#2F6FD6; --f2:#2E9E5B; --f3:#D9952B; --f4:#D24B6A;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16110E; --surface:#201914; --surface-2:#2B221C; --ink:#F1E8DF; --ink-2:#B3A396; --line:#3A2F28;
  --accent:#72B6CB; --accent-ink:#0D1A1F; --accent-soft:#1E3239;
  --brass:#E4B24C; --brass-soft:#3A2C14;
  --good:#6CC28C; --warn:#EAA33C; --bad:#F07A6E;
  --band-a:#2A2420; --band-b:#211B17; --wave:#6E6158; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16110E; --surface:#201914; --surface-2:#2B221C; --ink:#F1E8DF; --ink-2:#B3A396; --line:#3A2F28;
  --accent:#72B6CB; --accent-ink:#0D1A1F; --accent-soft:#1E3239;
  --brass:#E4B24C; --brass-soft:#3A2C14;
  --good:#6CC28C; --warn:#EAA33C; --bad:#F07A6E;
  --band-a:#2A2420; --band-b:#211B17; --wave:#6E6158; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px calc(84px + env(safe-area-inset-bottom,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
h1,h2,h3{margin:0;text-wrap:balance}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 14px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:var(--f-display);font-size:44px;line-height:.9;letter-spacing:.5px}
.brand .tuning{font-family:var(--f-mono);font-size:11px;letter-spacing:1.5px;white-space:nowrap;color:var(--ink-2);direction:ltr}
.streak{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px;white-space:nowrap}
.chip b{font-family:var(--f-mono);font-weight:600}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:22px 0 10px}
.section-h h2{font-family:var(--f-display);font-size:30px;line-height:1;letter-spacing:.3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 14px;min-height:42px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.small{min-height:44px;padding:6px 12px;font-size:15px}
.bigbtn svg,.btn svg,.cta svg{width:24px;height:24px;flex:none}
body.capturing [data-a="capture"]{display:none}
.vtog{position:absolute;bottom:8px;right:8px;left:8px;z-index:2;background:rgba(0,0,0,.62);color:#fff;border:0;border-radius:12px;padding:10px;font:inherit;font-size:14px;font-weight:700;min-height:44px;cursor:pointer}
.sprog{display:grid;gap:4px;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;font:inherit;color:var(--ink);width:100%;cursor:pointer}
.sprog .eb{font-size:13px;color:var(--accent);font-weight:700}.sprog b{font-size:18px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:2px;text-align:center}
.kpi .v{font-size:28px;font-weight:800;color:var(--accent);font-family:var(--f-mono)}.kpi .l{font-size:13px;font-weight:700}.kpi .hint{font-size:11px}
.pitem{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}.pitem:first-of-type{border-top:0}
.pn{width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800}
.ctbox{background:var(--accent-soft);border-radius:14px;padding:12px;display:grid;gap:8px;margin-top:8px}.cth{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ctnum{display:grid;place-items:center}.ctnum .n{font-size:54px;font-weight:800;font-family:var(--f-mono);color:var(--accent);line-height:1.1}
.prow{border-top:1px solid var(--line);padding:8px 0}.prow summary{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;cursor:pointer;list-style:none;min-height:44px}
.prow .pc{font-weight:700;font-family:var(--f-mono)}.pbar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.pbar i{display:block;height:100%;border-radius:6px}.pv{font-size:13px;font-family:var(--f-mono)}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.cc{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:2px;text-align:center}
.cc b{font-size:20px}.cc.good{border-color:#3a9d5d;background:color-mix(in srgb,#3a9d5d 12%,transparent)}.cc.mid{border-color:var(--warn)}.cc.low{border-color:#d9534f}
.srow{display:grid;gap:2px;padding:8px 0;border-top:1px solid var(--line)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}.confetti i{position:absolute;top:-10px;width:9px;height:14px;border-radius:2px;animation:cf 1.6s ease-in forwards}
@keyframes cf{to{transform:translateY(105vh) rotate(540deg);opacity:.6}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}
body.isplaying .splay .say,body.isplaying .splay #cur-note{display:none}
.btn.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px}
.list{display:flex;flex-direction:column;gap:8px}
.song{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;text-align:start;width:100%}
.song .ic{width:44px;height:44px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;color:var(--accent)}
.song .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song .meta{min-width:0}
.song .sub{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.song .chs{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:12px;border-radius:999px;padding:2px 9px;font-weight:600;white-space:nowrap}
.pill.learning{background:var(--accent-soft);color:var(--accent)}
.pill.almost{background:var(--brass-soft);color:var(--warn)}
.pill.done{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:22px 18px;display:grid;gap:12px;background:var(--surface)}
.inlays{display:flex;gap:18px;justify-content:center;padding:4px 0}
.inlays i{width:10px;height:10px;border-radius:50%;background:var(--brass);opacity:.7}
.inlays i.d{box-shadow:16px 0 0 var(--brass)}
.drill{display:flex;justify-content:space-between;align-items:center;gap:10px;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 2px;width:100%;text-align:start}
.drill .chs{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);direction:ltr}
/* nav */
nav.tabs{position:fixed;inset:auto 0 0 0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:20}
nav.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:720px}
nav.tabs button{background:none;border:0;padding:9px 4px 8px;display:grid;justify-items:center;gap:2px;font-size:12px;color:var(--ink-2)}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
nav.tabs svg{width:22px;height:22px}
/* song view */
.songhead{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding-block:6px 10px}
.songhead h2{font-size:20px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.songhead .sub{color:var(--ink-2);font-size:14px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.iconbtn svg{width:20px;height:20px}
.now{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.now .cur{display:flex;align-items:center;gap:14px;min-width:0}
.now .name{font-family:var(--f-mono);font-weight:600;font-size:54px;line-height:1;direction:ltr;color:var(--ink)}
.now .next{display:grid;justify-items:center;gap:2px;color:var(--ink-2);font-size:12px}
.now .next .nn{font-family:var(--f-mono);font-size:20px;font-weight:600;color:var(--ink-2);direction:ltr}
.bar{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;grid-column:1/-1}
.bar>i{display:block;height:100%;width:0;background:var(--brass)}
.timeline{position:relative;margin-top:12px;direction:ltr}
.timeline canvas{display:block;width:100%;height:96px;border-radius:10px;background:var(--surface);border:1px solid var(--line);touch-action:none}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);margin-top:4px;direction:ltr}
.controls{display:grid;gap:10px;margin-top:12px}
.transport{display:flex;align-items:center;justify-content:center;gap:16px;direction:ltr}
.playbtn{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;display:grid;place-items:center}
.playbtn svg{width:28px;height:28px}
.ctlgroup{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px}
.ctlgroup .lbl{font-size:13px;color:var(--ink-2);min-width:64px}
.seg{display:flex;gap:4px;flex-wrap:wrap;direction:ltr}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 9px;font-family:var(--f-mono);font-size:13px;min-width:40px;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stepper{display:flex;align-items:center;gap:6px;direction:ltr}
.stepper button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);padding:0}
.stepper output{font-family:var(--f-mono);min-width:34px;text-align:center}
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;direction:ltr;scrollbar-width:thin}
.strip button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;display:grid;gap:0;justify-items:start;min-width:58px}
.strip button b{font-family:var(--f-mono);font-size:17px;font-weight:600}
.strip button small{font-family:var(--f-mono);font-size:11px;color:var(--ink-2)}
.strip button.on{background:var(--brass-soft);border-color:var(--brass)}
.strip.editing button{border-style:dashed}
.diagrams{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.dg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 4px 6px;display:grid;justify-items:center;gap:2px}
.dg b{font-family:var(--f-mono);font-size:16px;direction:ltr}
.dg svg{width:76px;height:auto}
.dg.on{border-color:var(--brass);background:var(--brass-soft)}
svg.cd .str{stroke:var(--ink-2);stroke-width:1}
svg.cd .fr{stroke:var(--line);stroke-width:1.2}
svg.cd .nut{stroke:var(--ink);stroke-width:4}
svg.cd .dot{fill:var(--accent)}
svg.cd .barre{fill:var(--accent)}
svg.cd text{fill:var(--ink-2);font-family:var(--f-mono);font-size:10px}
svg.cd text.fn{fill:var(--accent-ink);font-size:7.5px;font-weight:600}
.handcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:10px;margin-top:10px}
.handcv{display:block;width:100%;height:220px;border-radius:10px;background:var(--surface-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-inline-end:5px;vertical-align:-2px}
.handhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.handhead b{font-family:var(--f-mono);font-size:18px}
.setupcv{display:block;margin:0 auto;border-radius:10px;touch-action:none;max-width:100%}
.steps{display:grid;gap:4px;font-size:13px}
.steps div{display:flex;gap:8px;align-items:center;color:var(--ink-2)}
.steps div.cur{color:var(--ink);font-weight:600}
.steps div.ok{text-decoration:line-through;opacity:.6}
.steps span.n{width:20px;height:20px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-family:var(--f-mono);color:#fff;flex:none}
.cta{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;background:var(--surface);border:1.5px dashed var(--brass);border-radius:14px;padding:14px;text-align:start;width:100%}
.cta svg{width:34px;height:34px;color:var(--brass)}
.notice{border:1px solid var(--brass);background:var(--brass-soft);border-radius:var(--r);padding:10px 12px;font-size:14px;display:grid;gap:8px}
.sheet .sec{margin-top:14px}
.sheet .sec h3{font-size:13px;font-weight:600;color:var(--ink-2);letter-spacing:.4px;margin-bottom:6px}
.sheet .line{display:flex;flex-wrap:wrap;gap:6px;direction:ltr;margin-bottom:6px}
.sheet .line button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-family:var(--f-mono);font-size:18px;font-weight:600;min-width:52px}
.sheet .line button.on{background:var(--brass);border-color:var(--brass);color:var(--accent-ink)}
.beats{display:flex;gap:6px;justify-content:center;direction:ltr}
.beats i{width:12px;height:12px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line)}
.beats i.on{background:var(--brass);border-color:var(--brass)}
.beats i.on.acc{background:var(--accent);border-color:var(--accent)}
/* forms */
.form{display:grid;gap:14px}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px 12px}
.field textarea{min-height:200px;font-family:var(--f-mono);font-size:14px;direction:ltr;text-align:left;line-height:1.7}
.hint{font-size:13px;color:var(--ink-2)}
.tabsw{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px}
.tabsw button{border:0;background:transparent;border-radius:9px;padding:9px;font-weight:600;color:var(--ink-2)}
.tabsw button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.drop{border:1.5px dashed var(--line);border-radius:12px;padding:18px;display:grid;gap:8px;justify-items:center;text-align:center;background:var(--surface)}
.progress{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.err{color:var(--bad);font-size:14px}
/* modal */
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 40%,transparent);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.modal .card{background:var(--bg);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px;max-height:88vh;overflow:auto}
.roots{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;direction:ltr}
.roots button,.quals button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 0;font-family:var(--f-mono);font-weight:600}
.quals{display:flex;flex-wrap:wrap;gap:6px;direction:ltr}
.quals button{padding:7px 11px}
.roots button[aria-pressed="true"],.quals button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px}
.bpmbig{font-family:var(--f-mono);font-size:56px;font-weight:600;line-height:1;text-align:center;direction:ltr}
.strings{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;direction:ltr}
.strings button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 0;display:grid;justify-items:center;gap:0}
.strings button b{font-family:var(--f-mono);font-size:20px}
.strings button small{font-size:11px;color:var(--ink-2);font-family:var(--f-mono)}
.strings button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.strings button.on small{color:var(--accent-ink)}
input[type=range]{width:100%;accent-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:14px;z-index:50}
/* beginner course + photo checks */
.prog{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}.prog i{display:block;height:100%;background:var(--good)}
.nextcard{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:16px;display:grid;gap:8px;margin-top:12px}
.nextcard .eyebrow{font-size:12px;letter-spacing:.6px;opacity:.85}
.nextcard h3{font-family:var(--f-display);font-size:36px;line-height:1}

<script>
// ===== ANALYSIS CORE (pure; x = mono Float32Array at sr) =====
const A_NOTES_S=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const A_NOTES_F=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
function fftInPlace(re,im){
  const n=re.length;
  for(let i=1,j=0;i<n;i++){let bit=n>>1;for(;j&bit;bit>>=1)j^=bit;j^=bit;if(i<j){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t;}}
  for(let len=2;len<=n;len<<=1){
    const ang=-2*Math.PI/len,wr=Math.cos(ang),wi=Math.sin(ang),half=len>>1;
    for(let i=0;i<n;i+=len){let cr=1,ci=0;
      for(let k=0;k<half;k++){const a=i+k,b=a+half;
        const xr=re[b]*cr-im[b]*ci,xi=re[b]*ci+im[b]*cr;
        re[b]=re[a]-xr;im[b]=im[a]-xi;re[a]+=xr;im[a]+=xi;
        const nr=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=nr;}}
  }
}
async function analyzeCore(x,sr,onP,opt){
  onP=onP||(()=>{});opt=opt||{};const rate=opt.rate||1;
  const yieldUI=()=>new Promise(r=>setTimeout(r,0));
  const len=x.length, duration=len/sr;
  // waveform peaks
  const P=320, peaks=[]; const step=Math.max(1,Math.floor(len/P)); let pmax=1e-9;
  for(let i=0;i<P;i++){let m=0;const end=Math.min(len,(i+1)*step);for(let j=i*step;j<end;j+=3){const a=Math.abs(x[j]);if(a>m)m=a;}peaks.push(m);if(m>pmax)pmax=m;}
  for(let i=0;i<P;i++)peaks[i]=Math.round(100*peaks[i]/pmax);
  // ---- spectrum frames: tonal peaks only (drums and noise are removed), mapped to the 12 notes ----
  const N=8192,H=2048,nF=Math.max(1,Math.floor((len-N)/H)+1),half=N/2;
  const binPc=new Int8Array(half).fill(-1),binW=new Float32Array(half),isBass=new Uint8Array(half);
  const kLo=Math.floor(55*N/sr),kHi=Math.min(half-2,Math.floor(2000*N/sr));
  for(let k=kLo;k<=kHi;k++){const f=k*sr/N;const m=69+12*Math.log2(f/440),r=Math.round(m),dev=Math.abs(m-r);if(dev>0.4)continue;binPc[k]=((r%12)+12)%12;binW[k]=Math.cos(dev*Math.PI/2*1.1);isBass[k]=f<240?1:0;}
  const win=new Float64Array(N);for(let i=0;i<N;i++)win[i]=0.5-0.5*Math.cos(2*Math.PI*i/(N-1));
  const re=new Float64Array(N),im=new Float64Array(N),mag=new Float64Array(half),avg=new Float64Array(half);
  const chroma=[],bass=[],energy=new Float64Array(nF),gChroma=new Float64Array(12);
  const R=24;
  for(let fr=0;fr<nF;fr++){
    const o=fr*H;
    for(let i=0;i<N;i++){const v=o+i<len?x[o+i]:0;re[i]=v*win[i];im[i]=0;}
    fftInPlace(re,im);let e=0;
    for(let k=0;k<half;k++){mag[k]=Math.hypot(re[k],im[k]);e+=mag[k];}

  const r=$('#toast-root');clearTimeout(toast.t);
  r.innerHTML=`<div class="toast helpbar" role="status" dir="rtl"><b>${esc(title)}</b><div>${esc(body)}</div><div class="url">${ART_URL}</div><div class="row"><a class="btn small" href="${ART_URL}" target="_blank" rel="noopener">פתח בדפדפן</a><button class="btn small" data-copyurl>העתק קישור</button><button class="btn small ghost" data-closehelp>סגור</button></div></div>`;
}
function openPicker(id){
  const inp=document.getElementById(id);if(!inp)return;let reacted=false;const mark=()=>{reacted=true;};
  window.addEventListener('blur',mark,{once:true});document.addEventListener('visibilitychange',mark,{once:true});inp.addEventListener('change',mark,{once:true});inp.addEventListener('cancel',mark,{once:true});
  try{inp.click();}catch(e){}
  setTimeout(()=>{window.removeEventListener('blur',mark);if(!reacted&&!document.hidden&&!STANDALONE)showHelpBar('המצלמה או בחירת הקבצים לא נפתחו?','בתוך אפליקציית Claude בטלפון זה לפעמים חסום. פתח את סריג בדפדפן כרום, שם המצלמה עובדת. אפשר גם להדביק תמונה שהעתקת.');},2500);
}
function aiUnavailable(img){
  if(STANDALONE){showHelpBar('הבדיקה הזו עובדת דרך Claude','באפליקציה המותקנת אין חיבור ל-Claude. פתח את סריג מתוך Claude כדי לבדוק בצילום או לשאול את המורה.');return;}
  if(!SAMPLE)showHelpBar('התכונה הזו עובדת דרך Claude','היא זמינה כשסריג פתוח מתוך Claude ואישרת לו להשתמש ב-Claude. אם לא הופיעה בקשת אישור, פתח את סריג בדפדפן ונסה שוב.');
  else showHelpBar('שליחת תמונות לא זמינה כאן','בתצוגה הזו אי אפשר לשלוח תמונות ל-Claude. פתח את סריג בדפדפן כרום ונסה שוב.');
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-pick]');
  if(b){e.preventDefault();const need=b.dataset.needsAi;if(need==='img'&&!SAMPLE_IMG){aiUnavailable(true);return;}openPicker(b.dataset.pick);return;}
  if(e.target.closest('[data-closehelp]')){$('#toast-root').innerHTML='';return;}
  if(e.target.closest('[data-copyurl]')){const done=()=>toast('הקישור הועתק');try{navigator.clipboard.writeText(ART_URL).then(done,()=>{const u=$('.helpbar .url');if(u){const rg=document.createRange();rg.selectNodeContents(u);const sl=getSelection();sl.removeAllRanges();sl.addRange(rg);}});}catch(err){}}
},true);
document.addEventListener('change',e=>{if(e.target.type==='file'&&$('.helpbar'))$('#toast-root').innerHTML='';},true);
document.addEventListener('paste',e=>{
  const files=[...((e.clipboardData&&e.clipboardData.files)||[])];const img=files.find(f=>/^image\//.test(f.type));if(!img)return;
  const scope=$('#modal-root .modal')||$('#view');const inp=[...scope.querySelectorAll('input[type=file]')].find(i=>/image/.test(i.accept));if(!inp)return;
  if(inp.id==='hc-file'||inp.id==='f-scan'){if(!SAMPLE_IMG){aiUnavailable(true);return;}}
  e.preventDefault();try{const dt=new DataTransfer();dt.items.add(img);inp.files=dt.files;inp.dispatchEvent(new Event('change',{bubbles:true}));}catch(err){}
});

function loadImg(url){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url;});}
async function setGuitarImg(blob){if(G.url)URL.revokeObjectURL(G.url);G.url=URL.createObjectURL(blob);try{G.img=await loadImg(G.url);}catch(e){G.img=null;}}
async function loadGuitar(){const r=await idb.get(GKEY);
  if(r&&r.buf&&r.pts&&r.pts.length===4){G.pts=r.pts;G.fret=r.fret||5;G.table=r.table||null;G.preset=false;await setGuitarImg(new Blob([r.buf],{type:r.type||'image/jpeg'}));if(G.img)return;}
  try{G.img=await loadImg(PRESET.img);G.pts=PRESET.pts.map(p=>({...p}));G.fret=PRESET.fret;G.table=PRESET.table.slice();G.preset=true;}catch(e){G.img=null;}}
async function downscale(file){const u=URL.createObjectURL(file);try{const im=await loadImg(u);const sc=Math.min(1,1800/Math.max(im.naturalWidth,im.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(r,'image/jpeg',0.86));}finally{URL.revokeObjectURL(u);}}
const lerp=(a,b,t)=>a+(b-a)*t;
const fretFrac=(k,F)=>(1-Math.pow(2,-k/12))/(1-Math.pow(2,-F/12));
const fingerG=(k,F)=>fretFrac(k-1,F)+0.62*(fretFrac(k,F)-fretFrac(k-1,F));
// measured fret positions (nut=0, marked fret=1) for a guitar whose frets were measured from its photo
function fretPosT(k,F,T){if(!T||T.length<3)return fretFrac(k,F);const n=T.length-1;if(k<=0)return k*T[1];
  if(k>=n)return T[n]+(fretFrac(k,F)-fretFrac(n,F))*(T[n]-T[n-1])/(fretFrac(n,F)-fretFrac(n-1,F));
  const i=Math.floor(k),f=k-i;return T[i]+f*(T[i+1]-T[i]);}

const STR_HE=['6 (העבה)','5','4','3','2','1 (הדקה)'],STR_EN=['6 (low E)','5 (A)','4 (D)','3 (G)','2 (B)','1 (high e)'];

  sh.frets.forEach((v,i)=>{if(v<=0)return;const f=sh.fingers[i]||0;if(sh.barre&&v===sh.barre.fret&&f===1)return;const k=v+capo;

  const muted=sh.frets.map((v,i)=>v<0?6-i:null).filter(x=>x!=null),open=sh.frets.map((v,i)=>v===0?6-i:null).filter(x=>x!=null);

function coachRun(){
  const box=$('#cd');if(!box)return;if(COACH.run){stopCoachRun();$('#cd-run').innerHTML=ICON.play+' התחל';box.classList.remove('go');return;}
  const list=box.dataset.list.split(','),open=!!box.dataset.open,target=+box.dataset.target;const bpm=+$('#cd-bpm').textContent;
  getAC();metro.bpm=bpm;metro.beats=4;metro.sound=true;let count=-4,idx=0,changes=0,strums=0;
  COACH.run={};keepAwake(true);practice.start('coach');$('#cd-run').innerHTML=ICON.pause+' עצור';box.classList.add('go');
  const now=$('#cd-now'),nx=$('#cd-nx'),cnt=$('#cd-cnt'),tip=$('#cd-tip');
  const nextOf=k=>list[(k+1)%list.length];
  if(!open){now.textContent=pretty(list[0]);setPhoto(list[0]);}
  nx.className='cd';nx.textContent='מתכוננים… 4';
  metro.start((n,b)=>{
    document.querySelectorAll('#cd-beats i').forEach((d,k)=>d.classList.toggle('on',k===b));
    if(count<0){count++;nx.textContent=count<0?`מתכוננים… ${-count}`:(open?'פרוט עכשיו!':'פרוט עכשיו!');return;}
    count++;
    if(open){strums++;cnt.textContent=`פריטות: ${strums} מתוך ${target}`;nx.textContent='פרוט בכל קליק';if(strums===target)toast('מעולה! לחץ "הבא"');return;}
    const beat=count%4;
    if(beat===0){idx=(idx+1)%list.length;changes++;now.textContent=pretty(list[idx]);setPhoto(list[idx]);
      cnt.textContent=`החלפות: ${changes} מתוך ${target}`;if(changes===target)toast('כל הכבוד! אפשר להמשיך, או לתרגל עוד');
      nx.className='cd';nx.textContent=`הבא: ${pretty(nextOf(idx))}`;if(tip)tip.innerHTML=transitionTip(list[idx],nextOf(idx));}
    else if(beat===2){nx.className='cd soon';nx.textContent=`עוד 2 · אחר כך ${pretty(nextOf(idx))}`;}
    else if(beat===3){nx.className='cd soon';nx.textContent=`עכשיו מזיזים ל-${pretty(nextOf(idx))}!`;}
    else{nx.className='cd';nx.textContent=`הבא: ${pretty(nextOf(idx))}`;}
  });
}

        $('#f-lk-u').href=t?'https://www.ultimate-guitar.com/search.php?search_type=title&value='+encodeURIComponent(t):'https://www.ultimate-guitar.com/';};
      links();['f-title','f-artist'].forEach(id=>{const el=$('#'+id);if(el)el.addEventListener('input',links);});
      const ta=$('#f-sheet');const info=()=>{const secs=parseSheet(ta.value);const n=secs.reduce((a,x)=>a+x.rows.length,0);const cp=detectCapo(ta.value);

        try{const r=await scanSheet(f);if(!r.sheet){st2.textContent='לא מצאתי אקורדים בתמונה. נסה צילום קרוב וחד יותר.';}else{ta.value=r.sheet;if(r.title&&!$('#f-title').value.trim())$('#f-title').value=r.title;if(r.artist&&!$('#f-artist').value.trim())$('#f-artist').value=r.artist;if(r.capo)$('#f-scapo').value=r.capo;info();links();st2.textContent='האקורדים נקלטו. עבור עליהם ותקן אם צריך.';}}

    }else{
      b.innerHTML=`<div class="drop"><div>${ICON.wave}</div><div><b>${song?'החלף קובץ שמע (לא חובה)':'בחר קובץ שיר'}</b><div class="hint">קובץ שמע (MP3, M4A, WAV) או סרטון. אין לך קובץ? הקלט סרטון בטלפון בזמן שהשיר מתנגן מרמקול, והעלה אותו. האקורדים, הקצב והסולם יזוהו לבד.</div></div>
        <button type="button" class="btn small" data-pick="f-file">בחר קובץ</button><input id="f-file" class="vh" type="file" accept="audio/*,video/*,.mp3,.m4a,.wav,.aac,.ogg,.flac,.mp4,.mov">
        <div id="f-fname" class="hint mono" dir="ltr"></div></div>

      if(st.file)$('#f-fname').textContent=st.file.name;
    }
  };
  const onFile=async e=>{
    const file=e.target.files[0];if(!file)return;st.file=file;st.result=null;$('#f-fname').textContent=file.name;
    const t=$('#f-title');if(!t.value.trim()){t.value=file.name.replace(/\.[^.]+$/,'').replace(/[_]+/g,' ');}
    const prog=$('#f-prog'),bar=prog.querySelector('i'),stage=$('#f-stage');prog.hidden=false;st.busy=true;$('#f-save').disabled=true;$('#f-err').hidden=true;
    const setP=(p,txt)=>{bar.style.width=Math.round(p*100)+'%';if(txt)stage.textContent=txt;};
    try{
      setP(0.02,'קורא את הקובץ…');
      const buf=await file.arrayBuffer();
      setP(0.05,'מפענח שמע…');
      const ac=getAC();const decoded=await new Promise((res,rej)=>{const p=ac.decodeAudioData(buf.slice(0),res,rej);if(p&&p.then)p.then(res,rej);});
      const sr=22050,OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
      const off=new OAC(1,Math.max(1,Math.ceil(decoded.duration*sr)),sr);const src=off.createBufferSource();src.buffer=decoded;src.connect(off.destination);src.start(0);
      const rendered=await new Promise((res,rej)=>{off.oncomplete=ev=>res(ev.renderedBuffer);const p=off.startRendering();if(p&&p.then)p.then(res,rej);});
      setP(0.1,'מזהה אקורדים…');
      const r=await analyzeCore(rendered.getChannelData(0),sr,p=>setP(p,p>0.87?'מזהה קצב וסולם…':null));
      const isVideo=/^video\//.test(file.type)||/\.(mp4|mov|webm|3gp|mkv)$/i.test(file.name);
      let keep=buf,ktype=file.type||'audio/mpeg';if(isVideo||buf.byteLength>25e6){keep=encodeWAV(rendered.getChannelData(0),sr);ktype='audio/wav';}
      st.result={...r,buf:keep,type:ktype,name:file.name};
      setP(1,`נמצאו ${r.chords.filter(c=>c.c!=='N').length} מעברי אקורד · ${r.bpm} BPM · סולם ${r.key}`);

    if(e.target.matches('.modal')||e.target.closest('[data-x]')){root.innerHTML='';root.onclick=null;return;}
    if(e.target.closest('[data-ytsearch]')){const q=`${$('#f-title').value} ${$('#f-artist').value}`.trim();const id=await pickYouTube(q);if(id)await setYT(id);return;}
    if(e.target.closest('[data-ytclear]')){st.yt=null;drawYT();const tw=$('.tabsw');if(tw)tw.hidden=false;return;}
    const m=e.target.closest('.tabsw [data-mode]');if(m){st.mode=m.dataset.mode;root.querySelectorAll('.tabsw button').forEach(b=>b.setAttribute('aria-pressed',b===m));drawBody();return;}
    if(e.target.closest('[data-aifill]')){
      if(!SAMPLE){aiUnavailable(false);return;}const st2=$('#f-scan-st');const title=$('#f-title').value.trim(),artist=$('#f-artist').value.trim();
      if(!title){st2.textContent='כתוב קודם את שם השיר (ורצוי גם את האמן) למעלה.';$('#f-title').focus();return;}
      if(st.busy)return;st.busy=true;$('#f-save').disabled=true;st2.textContent='Claude מחפש את האקורדים… עד דקה.';
      try{const r=await aiChords(title,artist);if(!r.sheet)st2.textContent='Claude לא מכיר את השיר הזה מספיק טוב. נסה דרך 1: חפש באתר אקורדים והדבק.';
        else{$('#f-sheet').value=r.sheet;if(r.capo)$('#f-scapo').value=r.capo;if(r.bpm)$('#f-bpm').value=r.bpm;$('#f-sheet').dispatchEvent(new Event('input'));st2.textContent='מולא. זה מהזיכרון של Claude ויכול לטעות, אז השווה לשיר בספוטיפיי.';}}
      catch(err){st2.textContent=aiErr(err);}st.busy=false;$('#f-save').disabled=false;return;}
    if(e.target.closest('#f-save')){
      if(st.busy)return;const err=$('#f-err');const title=$('#f-title').value.trim(),artist=$('#f-artist').value.trim(),spotify=$('#f-spot').value.trim();
      if(!title){err.textContent='צריך שם לשיר.';err.hidden=false;$('#f-title').focus();return;}
      if(spotify&&!/^https:\/\/(open\.)?spotify\.com\//.test(spotify)&&!/^https:\/\/spotify\.link\//.test(spotify)){err.textContent='הקישור צריך להתחיל ב-https://open.spotify.com';err.hidden=false;return;}
      const base=song?JSON.parse(JSON.stringify(song)):{id:uid(),createdAt:Date.now(),status:'learning',practiceSec:0,transpose:0,capo:0};
      Object.assign(base,{title,artist,spotify,mode:st.mode});if(song&&song.yt&&!st.yt)delete base.yt;
      if(st.yt){base.yt=st.yt;base.mode='yt';}else if(base.mode==='yt'){base.mode='sheet';delete base.yt;}
      if(st.mode==='sheet'&&st.yt&&!$('#f-sheet').value.trim()){base.sheet=base.sheet||'';}
      else if(st.mode==='sheet'){
        const sheet=$('#f-sheet').value;if(!parseSheet(sheet).length){err.textContent='לא מצאתי אקורדים. הדבק דף עם אקורדים (כמו G Am C), צלם דף, או לחץ "מלא אקורדים".';err.hidden=false;return;}
        const scapo=Math.max(0,Math.min(9,Math.round(+$('#f-scapo').value||0)));if(!editing||(song.sheetCapo||0)!==scapo)base.capo=scapo;base.sheetCapo=scapo;
        base.sheet=parseSheet(sheet).map(x=>(x.name?`[${x.name}]\n`:'')+x.rows.map(r=>r.join(' ')).join('\n')).join('\n\n');base.bpm=Math.min(220,Math.max(40,+$('#f-bpm').value||80));base.bpc=+$('#f-bpc').value||4;
      }else{
        if(!st.result&&!song){err.textContent='בחר קובץ שיר כדי לזהות אקורדים.';err.hidden=false;return;}
        if(st.result){const r=st.result;Object.assign(base,{chords:r.chords,duration:r.duration,bpm:r.bpm,key:r.key,peaks:r.peaks,fileName:r.name});
          const ok=await idb.put(base.id,{buf:r.buf,type:r.type,name:r.name});if(!ok)toast('קובץ השמע לא נשמר במכשיר, האקורדים כן');}
      }
      root.innerHTML='';root.onclick=null;
      await saveSong(base);
      if(!editing||st.result||(song&&song.yt!==base.yt)){route={tab:'library',song:null,lesson:null};openSong(base.id);}else{P.lastUpd=null;refreshSongStatic(true);}
      toast(editing?'נשמר':'השיר נוסף לספרייה');
    }
  };
}


/* ---------- installed app: native bridge (YouTube search, shared links, titles) ---------- */
const NATIVE=!!window.SarigNative;
const YT_ICON='<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4" fill="currentColor" opacity=".9"/><path d="M10 9l5 3-5 3z" fill="var(--bg)"/></svg>';
const NB={cb:{},n:0};
window.sarigMeta=(id,body)=>{const f=NB.cb[id];delete NB.cb[id];if(f)f(body);};
function nativeMeta(url){return new Promise(res=>{if(!NATIVE)return res(null);const id=++NB.n;NB.cb[id]=res;try{window.SarigNative.fetchMeta(url,id);}catch(e){delete NB.cb[id];res(null);}setTimeout(()=>{if(NB.cb[id]){delete NB.cb[id];res(null);}},12000);});}
let pickResolve=null;window.sarigOnPick=id=>{const r=pickResolve;pickResolve=null;if(r)r(id||null);};
function pickYouTube(q){return new Promise(res=>{if(!NATIVE)return res(null);pickResolve=res;try{window.SarigNative.pickYouTube(String(q||''));}catch(e){pickResolve=null;res(null);}});}
function parseMediaLink(t){t=String(t||'');
  let m=/(?:youtube\.com\/(?:watch\?(?:\S*?&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/.exec(t);if(m)return{yt:m[1]};
  m=/https?:\/\/(?:open\.spotify\.com\/(?:intl-[a-z-]+\/)?track\/[A-Za-z0-9]+|spotify\.link\/[A-Za-z0-9]+)\S*/.exec(t);if(m)return{spotify:m[0]};return null;}
function splitTitle(t,author){
  let x=String(t||'').replace(/\s*[\(\[][^\)\]]*(official|video|lyric|audio|clip|visuali|קליפ|מילים|רשמי|hd|4k|live|הופעה|prod)[^\)\]]*[\)\]]/ig,'').replace(/\s*\|.*$/,'').replace(/\s+/g,' ').trim();
  let artist=String(author||'').replace(/\s*-\s*Topic$/i,'').replace(/VEVO$/i,'').trim();

async function runCapture(s,opt){
  opt=opt||{};const want=opt.slow?1:(engine.fastest?engine.fastest():1);
  if(CAP.active)return;if(ytEngine.probing&&ytEngine.endProbe)ytEngine.endProbe();let st=$('#cap-st');
  if(!st){const box=document.createElement('div');box.className='hint';box.id='cap-st';const t=$('#view .controls')||$('#view');t.prepend(box);st=box;}
  if(!P.hasAudio){st.textContent='הסרטון עוד לא נטען.';return;}
  try{await micOpen(2048);}catch(e){st.textContent=micErrMsg(e);micStop();return;}
  MIC.mode='capture';CAP.active=true;document.body.classList.add('capturing');
  const ac=getAC(),srIn=ac.sampleRate,sp=ac.createScriptProcessor(4096,1,1),sink=ac.createGain();sink.gain.value=0;
  MIC.src.connect(sp);sp.connect(sink);sink.connect(ac.destination);
  const chunks=[];let rec=false,startT=null,n=0,done=false,rateOK=false;
  sp.onaudioprocess=e=>{if(!rec)return;if(!rateOK){try{rateOK=!engine.p||engine.p.getPlaybackRate()===want;}catch(err){rateOK=true;}if(!rateOK)return;}if(startT==null)startT=engine.time;const d=e.inputBuffer.getChannelData(0),o=new Float32Array(d.length>>1);for(let i=0;i<o.length;i++)o[i]=(d[2*i]+d[2*i+1])*0.5;chunks.push(o);n+=o.length;};
  const prev=engine.onstate;
  engine.onstate=code=>{if(prev)prev(code);if(code===1){rec=true;}else if(code===2||code===3){rec=false;}else if(code===0){finish(false);}};
  const cleanup=()=>{rec=false;clearInterval(ui);engine.onstate=prev;try{sp.disconnect();sink.disconnect();}catch(e){}sp.onaudioprocess=null;micStop();CAP.active=false;document.body.classList.remove('capturing');};
  CAP.cancel=()=>{if(done)return;done=true;cleanup();};
  const ui=setInterval(()=>{const el=$('#cap-st');if(el)el.innerHTML=`<b>${want>1?'מקשיב במהירות כפולה':'מקשיב'}… ${fmt(engine.time)} / ${fmt(engine.duration)}</b> <button class="btn small" data-a="capstop">סיים עכשיו</button>`;},500);
  CAP.finish=()=>finish(true);
  P.rate=want;engine.setRate(want);engine.seek(0);await engine.play();engine.setRate(want);setTimeout(()=>engine.setRate(want),400);
  async function finish(early){
    if(done)return;done=true;cleanup();engine.pause();
    const el=()=>$('#cap-st')||{set textContent(v){toast(v);}};
    if(n<(srIn/2)*8){el().textContent='ההקלטה קצרה מדי. נסה שוב ותן לשיר להתנגן לפחות 10 שניות.';return;}
    const x=new Float32Array(n);let o=0;for(const c of chunks){x.set(c,o);o+=c.length;}
    el().textContent='מנתח את האקורדים…';
    let r;try{r=await analyzeCore(x,srIn/2,p=>{const e2=$('#cap-st');if(e2)e2.textContent=`מנתח את האקורדים… ${Math.round(p*100)}%`;},{rate:want});}catch(err){el().textContent='הניתוח נכשל. נסה שוב.';return;}
    const off=startT||0;let chords=r.chords.map(c=>({t:+(c.t*want+off).toFixed(2),c:c.c}));if(off>0.5)chords.unshift({t:0,c:'N'});
    const end=off+r.duration*want;if(early)chords.push({t:+end.toFixed(2),c:'N'});
    const cur=getSong(s.id);if(!cur)return;const c2=JSON.parse(JSON.stringify(cur));
    P.rate=1;engine.setRate(1);
    {const cl=cleanChords(chords,engine.duration||end);chords=cl.chords;if(cl.key)r.key=cl.key;c2.cv=1;if(/just give me a reason/i.test(c2.title||'')){chords=snapToVocab(chords,COACH_VOCAB);c2.vocab=1;}}
    {const real=chords.filter(c=>c.c!=='N').length,before=hasChordsArr(cur.chords)?cur.chords.filter(c=>c.c!=='N').length:(hasChordsArr(cur.prevChords)?cur.prevChords.filter(c=>c.c!=='N').length:0);
      if(real<3||(before>=8&&real<before*0.4)){el().textContent=real<3?'לא שמעתי אקורדים. הגבר את הווליום, שמור על שקט ונסה שוב.':'שמעתי רק חלק מהשיר, אז שמרתי את האקורדים הקודמים. נסה שוב ותן לשיר להתנגן עד הסוף.';
        if(!hasChordsArr(cur.chords)&&hasChordsArr(cur.prevChords)){const c3=JSON.parse(JSON.stringify(cur));c3.chords=c3.prevChords;await saveSong(c3);P.segIdx=-9;P.lastUpd=null;refreshSongStatic(true);}return;}}
    Object.assign(c2,{chords,bpm:(()=>{let b=r.bpm/want;if(!b)return r.bpm;while(b<60)b*=2;while(b>180)b/=2;return Math.round(b);})(),key:r.key,duration:Math.round(engine.duration||end),peaks:null,lp:null});
    await saveSong(c2);P.segIdx=-9;P.lastUpd=null;refreshSongStatic(true);
    toast(`נכתבו ${chords.filter(c=>c.c!=='N').length} מעברי אקורד`);
  }
}

const LP={timer:0,loop:null,k:-1,drill:false};
function songPlan(s){
  let seq;
  if(timed(s))seq=s.chords.map((c,i)=>({c:c.c,t:c.t,i})).filter(x=>x.c!=='N');
  else{seq=[];parseSheet(s.sheet).forEach(sec=>sec.rows.forEach(r=>r.forEach(c=>seq.push({c}))));}
  const names=[];seq.forEach(x=>{const d=disp(s,x.c);if(!names.includes(d))names.push(d);});
  const pc={};for(let i=0;i+1<seq.length;i++){const a=disp(s,seq[i].c),b=disp(s,seq[i+1].c);if(a===b)continue;const k=[a,b].sort().join('|');pc[k]=(pc[k]||0)+1;}
  const pairs=Object.entries(pc).sort((a,b)=>b[1]-a[1]).slice(0,5).map(x=>x[0].split('|'));
  const segs=[];
  if(timed(s)){const ch=s.chords;const dur=s.duration||(ch.length?ch[ch.length-1].t+4:0);let cur=null;
    for(let i=0;i<ch.length;i++){const c=ch[i];const end=i+1<ch.length?ch[i+1].t:dur;
      if(!cur){if(c.c==='N')continue;cur={a:Math.max(0,c.t-0.3),b:end,list:[]};}
      if(c.c!=='N'){const d=disp(s,c.c);if(cur.list[cur.list.length-1]!==d)cur.list.push(d);}cur.b=end;
      if(cur.list.length>=6||cur.b-cur.a>=22){segs.push(cur);cur=null;}}
    if(cur&&cur.list.length)segs.push(cur);}
  else parseSheet(s.sheet).forEach(sec=>{const list=sec.rows.flat().map(c=>disp(s,c));if(list.length)segs.push({name:sec.name,list});});
  return{names,pairs,segs};
}

  let rms=0;for(let i=0;i<b.length;i++)rms+=b[i]*b[i];rms=Math.sqrt(rms/b.length);if(rms<0.008)return 0;

    for(let fr=0;fr<=5;fr++){if(fr===x.v)continue;const m=base+fr;if(chordPcs.has(m%12)||OPEN_MIDI.some((o,j)=>j!==x.i&&o+capo===m))continue;const p=peakAt(440*Math.pow(2,(m-69)/12));if(p.m>0.45*ref&&(!best||p.m>best.m))best={fr,m:p.m};}
    if(best)w.alt=best.fr;}
  const ringX=xs.filter(x=>own(x)>0.45*ref).map(x=>x.s);
  // strong notes that are not in the chord at all (and are not overtones)
  const extra=[];const kLo=Math.floor(75/binHz),kHi=Math.min(acc.length-2,Math.floor(450/binHz));let mx=0;for(let k=kLo;k<=kHi;k++)mx=Math.max(mx,acc[k]);
  for(let k=kLo+1;k<kHi;k++){const m=acc[k];if(m<mx*0.35||m<acc[k-1]||m<acc[k+1])continue;const f=k*binHz,midi=Math.round(69+12*Math.log2(f/440)),pc=((midi%12)+12)%12;if(chordPcs.has(pc))continue;
    let expl=false;for(const y of strs){const r=f/y.f,hn=Math.round(r);if(hn>=2&&Math.abs(1200*Math.log2(r/hn))<40)expl=true;}
    if(xs.some(y=>Math.abs(1200*Math.log2(f/y.f))<50))expl=true;
    if(!expl&&!extra.includes(pc))extra.push(pc);}
  let wd=0,ww=0;played.forEach((x,k)=>{const p=raw.get(x);if(sc[k]<0.3*ref)return;const c=1200*Math.log2(p.f/x.f);if(Math.abs(c)<60){wd+=c*p.m;ww+=p.m;}});
  return{weak,ringX,extra,detune:ww?wd/ww:0,sc,ref};}
async function runListen(box){
  const out=box.querySelector('.lsnout');let name=box.dataset.lchord;if(name==='@current'){const c=$('#cur-name');name=c?c.textContent.trim():'';}
  const capo=+box.dataset.lcapo||0;const sh=shapeFor(name);out.hidden=false;
  if(!sh){out.textContent='אין אקורד לבדוק כרגע.';return;}
  if(MIC.mode==='listen')return;
  try{await micOpen(16384);}catch(e){out.textContent=micErrMsg(e);micStop();return;}
  MIC.mode='listen';const an=MIC.an,sr=getAC().sampleRate,td=new Float32Array(2048),fd=new Float32Array(an.frequencyBinCount);
  out.innerHTML=`<b>מקשיב… פרוט את ${esc(name)} עכשיו, פעם אחת, לאט מלמעלה למטה.</b>`;
  const rmsNow=()=>{an.getFloatTimeDomainData(td);let q=0;for(const v of td)q+=v*v;return Math.sqrt(q/td.length);};
  let base=0;for(let i=0;i<4;i++){await new Promise(r=>setTimeout(r,60));base=Math.max(base,rmsNow());}
  const t0=performance.now();let hit=false;
  while(performance.now()-t0<8000&&MIC.mode==='listen'){await new Promise(r=>setTimeout(r,40));const r=rmsNow();if(r>Math.max(0.02,base*3)){hit=true;break;}}
  if(!hit){micStop();out.textContent='לא שמעתי את הגיטרה. קרב את הטלפון ונסה שוב.';return;}
  out.innerHTML='<b>שומע…</b>';
  const binHz=sr/an.fftSize;const hiK=Math.min(fd.length-2,Math.floor(1400/binHz));const acc=new Float64Array(hiK+2);
  for(let fr=0;fr<14;fr++){await new Promise(r=>setTimeout(r,90));an.getFloatFrequencyData(fd);for(let k=1;k<=hiK;k++)acc[k]+=Math.pow(10,fd[k]/20);}
  micStop();
  const J=judgeStrum(acc,binHz,sh,capo);const {weak,ringX,extra,detune}=J;
  const items=[];let verdict;const FN=['','המורה','האמה','הקמיצה','הזרת'];
  const bad=weak.length||extra.length;recCheck(name,!bad);
  if(Math.abs(detune)>22){verdict=`<span class="pill almost">כנראה לא מכוון</span>`;items.push(`הצלילים יוצאים ${detune<0?'נמוכים':'גבוהים'} בערך ב-${Math.round(Math.abs(detune))} סנט מהנכון. כוון קודם עם הטיונר, ואז מה שהאפליקציה משמיעה יישמע כמו הגיטרה שלך.`);}
  if(!bad){verdict=verdict||`<span class="pill done">נשמע נכון</span>`;items.push(`כל המיתרים של ${pretty(name)} נשמעים נכון.`);
    if(ringX.length)items.push(`טיפ קטן: פרטת גם את מיתר ${ringX.join(' ו-')}. באקורד הזה מתחילים לפרוט ממיתר ${6-sh.frets.findIndex(x=>x>=0)} (העבה ביותר שמסומנת).`);
    if(window.onListenOk&&Math.abs(detune)<=22)window.onListenOk(name);}
  else{verdict=verdict||`<span class="pill bad">משהו לא מדויק</span>`;
    for(const w of weak){const i=6-w.s,v=sh.frets[i],f=sh.fingers&&sh.fingers[i];
      if(w.alt!=null&&v>0)items.push(`מיתר ${w.s}: שמעתי ${w.alt===0?'אותו פתוח':'משבצת '+w.alt}, אבל צריך משבצת ${v+capo} (${f?FN[f]:'האצבע'}). בדוק בתמונה.`);
      else if(w.alt!=null&&v===0)items.push(`מיתר ${w.s} צריך להיות פתוח: אל תלחץ עליו (שמעתי משבצת ${w.alt}).`);
      else if(v>0)items.push(`מיתר ${w.s} לא נשמע טוב: ${f?FN[f]:'האצבע'} צריכה ללחוץ עליו במשבצת ${v+capo}. לחץ חזק יותר עם קצה האצבע, ממש ליד פס המתכת.`);
      else items.push(`מיתר ${w.s} (פתוח) לא נשמע. כנראה אצבע אחרת נוגעת בו. הרם קצת את האצבעות, כך שרק הקצה נוגע.`);}
    if(extra.length)items.push(`נשמע צליל שלא שייך ל-${pretty(name)}. בדוק שכל אצבע במשבצת ובמיתר הנכונים, כמו בתמונה.`);
    if(ringX.length)items.push(`פרטת גם את מיתר ${ringX.join(' ו-')}, שמסומן ב-×. התחל לפרוט ממיתר ${6-sh.frets.findIndex(x=>x>=0)}.`);}
  const missing=weak,extraN=extra;
  LT[name]=(LT[name]||0)+1;if(LT[name]>1&&(missing.length||extraN.length))items.unshift(`ניסיון ${LT[name]}`);
  out.innerHTML=`<div>${verdict}</div><ul>${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="hint">הבדיקה בשמיעה טובה בחדר שקט. אם יש רעש היא יכולה לטעות.</div>`;
}
document.addEventListener('click',e=>{
  const m=e.target.closest('[data-mic="tuner"]');if(m){e.stopPropagation();if(MIC.mode==='tuner')micStop();else{micStop();startTuner(m);}return;}
  const l=e.target.closest('[data-listen]');if(l){e.stopPropagation();runListen(l.closest('.lsn'));}

/* ---------- tools: tuner tones + metronome ---------- */
const TUNING=[['E',40,'6'],['A',45,'5'],['D',50,'4'],['G',55,'3'],['B',59,'2'],['E',64,'1']];
let toneTimer=null,toneStr=null,taps=[];
function stopTone(){clearInterval(toneTimer);toneTimer=null;toneStr=null;}
function stopMetronomeTool(){if(metro.on&&!P.along.on){metro.stop();keepAwake(false);}stopTone();}
function renderTools(){
  const v=$('#view');
  v.innerHTML=`<div class="section-h"><h2>טיונר</h2><span class="hint mono" dir="ltr">A4 = 440Hz</span></div>
  ${micTunerHTML()}
  <div class="tool" style="margin-top:10px"><div class="hint">אפשר גם לכוון לפי השמיעה: בחר מיתר כדי לשמוע את הצליל הנכון שוב ושוב, וכוון את הגיטרה עד שהצלילים נשמעים זהים.</div>
    <div class="strings">${TUNING.map(([n,m,s],i)=>`<button data-tone="${i}" class="${toneStr===i?'on':''}" aria-pressed="${toneStr===i}"><b>${n}</b><small>מיתר ${s}</small></button>`).join('')}</div>
    <div class="row"><button class="btn small" data-a2="tonestop" ${toneStr==null?'disabled':''}>עצור צליל</button><button class="btn small" data-a2="allstr">כל המיתרים ברצף</button></div></div>
  <div class="section-h"><h2>מטרונום</h2></div>
  <div class="tool">
    <div class="bpmbig" id="m-bpm">${metro.bpm}</div><div class="hint" style="text-align:center">BPM</div>
    <input id="m-range" type="range" min="40" max="220" value="${metro.bpm}" aria-label="קצב">
    <div class="beats" id="m-beats">${Array.from({length:metro.beats},(_,i)=>`<i class="${i===0?'acc':''}"></i>`).join('')}</div>
    <div class="row" style="justify-content:center"><button class="btn small" data-a2="m-"><bdi dir="ltr">−1</bdi></button><button class="playbtn" data-a2="mplay" aria-label="${metro.on?'עצור':'הפעל'}">${metro.on&&!P.along.on?ICON.pause:ICON.play}</button><button class="btn small" data-a2="m+"><bdi dir="ltr">+1</bdi></button></div>
    <div class="ctlgroup"><span class="lbl">משקל</span><div class="seg">${[2,3,4,6].map(n=>`<button data-beats="${n}" aria-pressed="${metro.beats===n}">${n}/4</button>`).join('')}</div></div>
    <button class="btn" data-a2="tap">הקש בקצב (Tap)</button>
  </div>`;
  const rg=$('#m-range');rg.addEventListener('input',()=>{metro.bpm=+rg.value;$('#m-bpm').textContent=metro.bpm;});
}
function playTone(i){const ac=getAC();pluck(mf(TUNING[i][1]),ac.currentTime+0.02,0.3);}
$('#view').addEventListener('click',e=>{
  if(route.song||route.tab!=='tools')return;
  const bt=e.target.closest('[data-beats]');if(bt){metro.beats=+bt.dataset.beats;const on=metro.on;if(on){metro.stop();}renderTools();if(on)startToolMetro();return;}
  const a=e.target.closest('[data-a2]');if(!a)return;
  switch(a.dataset.a2){
    case'tonestop':stopTone();renderTools();break;
    case'allstr':{stopTone();const ac=getAC();TUNING.forEach((s,i)=>pluck(mf(s[1]),ac.currentTime+0.05+i*0.7,0.3));renderTools();break;}
    case'mplay':if(metro.on){metro.stop();keepAwake(false);renderTools();}else{startToolMetro();renderTools();}break;
    case'm-':case'm+':metro.bpm=Math.min(220,Math.max(40,metro.bpm+(a.dataset.a2==='m+'?1:-1)));$('#m-bpm').textContent=metro.bpm;$('#m-range').value=metro.bpm;break;
    case'tap':{const now=performance.now();taps=taps.filter(x=>now-x<3000);taps.push(now);if(taps.length>=2){const iv=[];for(let k=1;k<taps.length;k++)iv.push(taps[k]-taps[k-1]);const avg=iv.reduce((x,y)=>x+y,0)/iv.length;metro.bpm=Math.min(220,Math.max(40,Math.round(60000/avg)));$('#m-bpm').textContent=metro.bpm;$('#m-range').value=metro.bpm;}getAC();click(getAC().currentTime+0.01,false);break;}
  }
});
function startToolMetro(){getAC();metro.start((n,b)=>{document.querySelectorAll('#m-beats i').forEach((d,k)=>d.classList.toggle('on',k===b));});keepAwake(true);}
