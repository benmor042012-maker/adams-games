<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2C7A76">
<meta name="description" content="משחקי למידה בעברית לילדים: מספרים, צבעים, חיות, גדלים ורגשות.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="המשחקים של אדם">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}</style>
<title>המשחקים של אדם</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: one calm full-screen app — child screens (start, home, game) are fixed-height with no page scroll; the adult settings screen scrolls. Single light theme by choice. */
:root{
  --bg:#EAF2F1;          /* soft sea-glass ground */
  --surface:#FFFFFF;
  --ink:#22343A;
  --ink-soft:#56686E;
  --line:#CFDDDA;
  --accent:#2C7A76;      /* calm teal for buttons and focus */
  --accent-soft:#D5ECE9;
  --glow:#F4C95D;        /* warm hint halo */
  --note:#FFF6DC;
  --note-line:#E8CE84;
  --display:"Fredoka","Arial Hebrew","Rubik",Arial,sans-serif;
  --body:"Assistant","Arial Hebrew",Arial,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;margin:0;overflow:hidden;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
body{direction:rtl}
:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-bottom,0px))}
.screen[hidden]{display:none!important}
.nosel{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}

/* ---------- start ---------- */
#start{align-items:center;justify-content:center;gap:28px;text-align:center}
.start-title{font-family:var(--display);font-weight:600;font-size:clamp(30px,7vw,52px);margin:0;letter-spacing:.01em;text-wrap:balance}
.bigplay{width:clamp(140px,34vmin,220px);height:clamp(140px,34vmin,220px);border-radius:50%;border:0;background:var(--accent);
  color:#fff;cursor:pointer;display:grid;place-items:center;box-shadow:0 10px 0 #1F5A57}
.bigplay svg{width:46%;height:46%}
.bigplay:active{transform:translateY(6px);box-shadow:0 4px 0 #1F5A57}
.adult-line{font-size:15px;color:var(--ink-soft);max-width:34em}
.adult-line b{color:var(--ink)}

/* ---------- home ---------- */
#home{gap:12px}
.home-head{display:flex;align-items:center;justify-content:center;min-height:40px}
.home-head h1{font-family:var(--display);font-weight:500;font-size:22px;margin:0;color:var(--ink-soft)}
.tiles{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,3vmin,24px);align-content:center;
  max-width:760px;width:100%;margin-inline:auto;min-height:0}
@media (min-aspect-ratio:3/2){.tiles{grid-template-columns:repeat(5,minmax(0,1fr));max-width:1200px}}
@media (min-aspect-ratio:1/1) and (max-aspect-ratio:3/2){.tiles{grid-template-columns:repeat(3,minmax(0,1fr));max-width:900px}}
@media (max-aspect-ratio:1/1){.tile{max-height:27vh}}
.tile{background:var(--surface);border:3px solid var(--line);border-radius:28px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:6px;padding:12px;min-height:0;aspect-ratio:1/1;max-height:38vh;width:100%;margin-inline:auto}
.tile svg{width:68%;height:auto;max-height:72%}
.tile span{font-family:var(--display);font-size:clamp(14px,2.4vmin,19px);color:var(--ink-soft)}
.tile:active{transform:scale(.98)}
.home-foot{display:flex;justify-content:flex-end;align-items:center}
.holdbtn{position:relative;display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:var(--surface);
  border-radius:999px;padding:8px 16px 8px 10px;cursor:pointer;font-size:15px;color:var(--ink-soft)}
.holdbtn .ring{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--accent) calc(var(--p,0)*1turn),var(--accent-soft) 0)}
.holdbtn .ring i{width:26px;height:26px;border-radius:50%;background:var(--surface);display:grid;place-items:center}
.holdbtn .ring svg{width:18px;height:18px}

/* ---------- game ---------- */
#game{gap:8px;padding-block:max(8px,env(safe-area-inset-top,0px)) max(8px,env(safe-area-inset-bottom,0px))}
.topbar{display:flex;align-items:center;gap:10px}
.tb{width:60px;height:60px;border-radius:20px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none}
.tb svg{width:30px;height:30px}
.tb.repeat{width:84px;height:68px;border-radius:24px;background:var(--accent);border-color:var(--accent);color:#fff}
.tb.repeat svg{width:38px;height:38px}
.tb[disabled]{opacity:.35;cursor:default}
.tb.soft-emph{border-color:var(--glow);box-shadow:0 0 0 4px #F4C95D55}
.tb.testhint{width:auto;height:44px;padding:0 12px;border-style:dashed;border-radius:14px;font-size:14px;color:var(--ink-soft);display:flex;gap:6px}
.tb.testhint svg{width:20px;height:20px}
.tb-spacer{flex:1}
.modetag{font-size:13px;color:var(--ink-soft);border:1px solid var(--line);border-radius:999px;padding:2px 10px;background:var(--surface);white-space:nowrap}
.mid{flex:1;display:flex;justify-content:center}
#stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;gap:8px;touch-action:none}
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:var(--gap,14px);width:100%}
.row.ltr{direction:ltr}
.cell{box-sizing:border-box;width:var(--cell,120px);flex:none;position:relative;border:0;padding:0;background:none;cursor:pointer;touch-action:none;border-radius:22px}
.cell svg{display:block;width:100%;height:auto;pointer-events:none}
.card{background:var(--surface);border:3px solid var(--line);border-radius:22px;padding:calc(var(--cell,120px) * .08)}
.target.card{border-style:solid}
.cell.selected{transform:translateY(-8px);box-shadow:0 0 0 5px var(--accent)}
.cell.card.selected{border-color:var(--accent);box-shadow:0 8px 0 var(--accent-soft)}
.cell.hint{box-shadow:0 0 0 6px var(--glow),0 0 26px 6px #F4C95D88}
.cell.lifted{opacity:.25}
.cell.gone{visibility:hidden}
.cell.dim{opacity:.45}
.cell.chosen{box-shadow:0 0 0 6px var(--accent)}
.lbl{display:block;text-align:center;font-family:var(--display);font-weight:500;color:var(--ink);
  font-size:clamp(15px,calc(var(--cell,120px) * .15),28px);line-height:1.15;padding-top:4px;pointer-events:none;white-space:nowrap}
.panel .pic{width:clamp(48px,12vmin,96px);flex:none}
@media (max-width:480px){.panel{padding:10px 12px;gap:10px}.panel .rewards{order:5;width:100%;justify-content:center}.nextbtn{width:72px;height:72px}}
.panel .pic svg{display:block;width:100%;height:auto}
.panel .rewards[hidden]{display:none}
.slot{position:absolute;left:50%;top:42%;width:52%;transform:translate(-50%,-50%);pointer-events:none}
.slot svg{filter:drop-shadow(0 3px 2px #0003)}
.slot.top{top:30%}
.fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.fx-b{position:absolute}.fx-b svg{display:block;width:100%;height:auto}
.fx-c{position:absolute;width:16px;height:11px;border-radius:4px}
.fx-p{position:absolute;opacity:0}.fx-p svg{display:block;width:100%;height:auto;filter:drop-shadow(0 2px 2px #0002)}
.fx-t{position:absolute;font-family:var(--display);font-weight:600;font-size:clamp(34px,9vw,60px);color:var(--accent);white-space:nowrap;opacity:0;
  text-shadow:0 2px 0 #fff,0 0 12px #fff}
.ghost{position:fixed;z-index:50;pointer-events:none;margin:0}
.ghost svg{display:block;width:100%;height:auto}
.balloon-btn{border-radius:40%}
.panel{box-sizing:border-box;flex-wrap:wrap;justify-content:center;position:absolute;inset:auto 0 0 0;margin-inline:auto;width:min(560px,100%);background:var(--surface);border:3px solid var(--line);
  border-radius:28px;padding:14px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px #22343A22;z-index:20}
.panel .word{min-width:0;font-family:var(--display);font-weight:600;font-size:clamp(34px,7vmin,56px);line-height:1.1;flex:1;text-align:center}
.panel .word small{display:block;font-size:.42em;font-weight:500;color:var(--ink-soft)}
.panel .rewards{display:flex;gap:6px;direction:ltr}
.panel .rewards button{width:clamp(34px,9vw,46px);border:0;background:none;padding:0;cursor:pointer}
.panel .rewards button svg{width:100%;height:auto;display:block}
.nextbtn{width:84px;height:84px;border-radius:50%;border:0;background:var(--accent);color:#fff;cursor:pointer;display:grid;place-items:center;flex:none;box-shadow:0 6px 0 #1F5A57}
.nextbtn svg{width:44px;height:44px}
.nextbtn[hidden]{display:none}
.blocked{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;max-width:36em;margin-inline:auto}
.blocked h2{font-family:var(--display);font-weight:500;margin:0;font-size:24px}

/* ---------- settings ---------- */
#settings{overflow-y:auto;overscroll-behavior:contain;display:block;background:#F4F8F7}
.set-wrap{max-width:820px;margin-inline:auto;padding-block:8px 60px;display:flex;flex-direction:column;gap:18px}
.set-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;background:#F4F8F7;padding-block:8px;z-index:5}
.set-head h1{font-family:var(--display);font-weight:500;font-size:26px;margin:0;flex:1;min-width:0}
.btn{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:4px 10px;font-size:14px;font-weight:600}
.btn.quiet{color:var(--ink-soft)}
section.box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
section.box h2{font-family:var(--display);font-weight:500;font-size:20px;margin:0}
.box p{margin:0}
.hint-text{font-size:15px;color:var(--ink-soft)}
.note{background:var(--note);border:1px solid var(--note-line);border-radius:12px;padding:10px 14px;font-size:15px}
.note ul{margin:6px 0 0;padding-inline-start:20px}
.field{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.field>label:first-child,.field>.lab{min-width:9em;font-weight:600}
select,input[type=range]{font:inherit}
select{border:2px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--surface);max-width:100%}
input[type=range]{width:min(260px,100%);accent-color:var(--accent)}
.chk{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;background:var(--surface)}
.chk input{accent-color:var(--accent);width:18px;height:18px}
.chk:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.act-box{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.act-box:first-of-type{border-top:0;padding-top:0}
.act-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.act-title h3{margin:0;font-family:var(--display);font-weight:500;font-size:18px;flex:1}
.stage-desc{font-size:14.5px;color:var(--ink-soft)}
.tag{display:inline-block;font-size:13px;border-radius:999px;padding:1px 9px;border:1px solid var(--line)}
.tag.test{border-color:#B9A15A;background:var(--note)}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;font-size:15px;min-width:100%}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-weight:600;color:var(--ink-soft)}
.files{display:flex;flex-direction:column;gap:6px}
.frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-block:6px}
.frow .w{min-width:7em;font-weight:600}
.frow .st{font-size:14px;color:var(--ink-soft);flex:1;min-width:8em}
.st-ok{color:var(--accent)!important}
.st-miss{color:#8A6B12!important}
.filelab{position:relative;overflow:hidden}
.filelab input{position:absolute;inset:0;opacity:0;cursor:pointer}
details summary{cursor:pointer;font-weight:600}

/* ---------- motion ---------- */
.anim-full .cell,.anim-reduced .cell{transition:transform .2s ease,box-shadow .2s ease,opacity .2s ease}
.anim-full .bob{animation:bob 5s ease-in-out infinite}
.anim-full .bob:nth-child(2n){animation-delay:-2.5s}
@keyframes bob{50%{transform:translateY(-6px)}}
.pop,.anim-full .bob.pop{animation:popout .35s ease forwards}
.anim-reduced .pop{animation-duration:.2s}
.anim-off .pop.pop{visibility:hidden}
.anim-off .pop{animation:none;visibility:hidden}
@keyframes popout{to{transform:scale(1.25);opacity:0}}
.anim-off *{transition:none!important;animation:none!important}
@media (prefers-reduced-motion:reduce){.bob{animation:none!important}}
</style>
</head>
<body>


<!-- ============ START ============ -->
<div id="start" class="screen nosel">
  <p class="start-title">המשחקים של אדם</p>
  <button class="bigplay" id="startBtn" aria-label="התחלה">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" transform="scale(-1 1) translate(-24 0)"/></svg>
  </button>
  <p class="adult-line" id="startVoiceLine">בודק קריינות בעברית…</p>
  <button class="btn" id="testSoundBtn" hidden>בדיקת קול: "שלוש"</button>
</div>

<!-- ============ HOME ============ -->
<div id="home" class="screen nosel" hidden>
  <div class="home-head"><h1>מה משחקים?</h1></div>
  <div class="tiles" id="tiles"></div>
  <div class="home-foot">
    <button class="holdbtn" id="adultBtn" aria-label="הגדרות למבוגר: לחיצה ארוכה">
      <span class="ring"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></i></span>
      הגדרות למבוגר · לחיצה ארוכה
    </button>
  </div>
</div>

<!-- ============ GAME ============ -->
<div id="game" class="screen nosel" hidden>
  <div class="topbar">
    <button class="tb" id="homeBtn" aria-label="חזרה לבית">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/></svg>
    </button>
    <div class="mid"><button class="tb repeat" id="repeatBtn" aria-label="לשמוע שוב">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
    </button></div>
    <button class="tb" id="demoBtn" aria-label="הדגמה">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10m0-1.5a1.5 1.5 0 0 1 3 0V11m0-1a1.5 1.5 0 0 1 3 0v4.5a6 6 0 0 1-6 6h-.6a6 6 0 0 1-4.6-2.2L4.6 15a1.5 1.5 0 0 1 2.3-1.9L9 15"/></svg>
    </button>
    <button class="tb" id="hintBtn" aria-label="רמז">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>
    </button>
    <button class="tb testhint" id="testHintBtn" aria-label="רמז למבוגר. סבב עם רמז לא נספר כהבנה עצמאית">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>רמז
    </button>
    <span class="modetag" id="modeTag"></span>
  </div>
  <div id="stage"></div>
</div>

<!-- ============ SETTINGS ============ -->
<div id="settings" class="screen" hidden>
  <div class="set-wrap" id="setWrap"></div>
</div>

<input type="file" id="filePick" accept="audio/*" hidden>
<input type="file" id="bulkPick" accept="audio/*" multiple hidden>

<script>
"use strict";
document.documentElement.lang = "he"; document.documentElement.dir = "rtl";
/* ================= data ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const NUM_WORDS = ['אחת','שתיים','שלוש','ארבע','חמש','שש','שבע','שמונה','תשע','עשר'];
const COLORS = {
  red:{t:'אדום',c:'#D8392F'}, blue:{t:'כחול',c:'#2E6FD8'}, yellow:{t:'צהוב',c:'#F5C72E'}, green:{t:'ירוק',c:'#33994A'},
  orange:{t:'כתום',c:'#F27D1E'}, purple:{t:'סגול',c:'#8B4FC6'}, pink:{t:'ורוד',c:'#EF86B5'}, brown:{t:'חום',c:'#8A5531'},
  black:{t:'שחור',c:'#2A2A2C'}, white:{t:'לבן',c:'#FFFFFF'}
};
const ANIMALS = {
  dog:{t:'כלב',snd:'הב הב'}, cat:{t:'חתול',snd:'מיאו'}, cow:{t:'פרה',snd:'מוווו'}, duck:{t:'ברווז',snd:'גע גע'},
  fish:{t:'דג'}, sheep:{t:'כבשה',snd:'מההה'}, rabbit:{t:'ארנב'}, turtle:{t:'צב'},
  lion:{t:'אריה',snd:'גררר'}, elephant:{t:'פיל',snd:'פררררו'}, monkey:{t:'קוף',snd:'או או אה אה'}, giraffe:{t:"ג'ירפה"},
  frog:{t:'צפרדע',snd:'קווה קווה'}, bear:{t:'דוב',snd:'גררר'}, mouse:{t:'עכבר',snd:'ציף ציף'}, pig:{t:'חזיר',snd:'אוינק אוינק'},
  hen:{t:'תרנגולת',snd:'קוד קוד קוד'}, owl:{t:'ינשוף',snd:'הו הו'}, penguin:{t:'פינגווין'}, butterfly:{t:'פרפר'}

/* hold-to-open adult settings, so a quick child tap does nothing */
(function holdGate() {
  const btn = $('#adultBtn'); let t0 = 0, raf = 0;
  const HOLD = 1400;
  const step = () => { const p = Math.min(1, (performance.now() - t0) / HOLD); btn.style.setProperty('--p', p);
    if (p >= 1) { end(); openSettings(); } else raf = requestAnimationFrame(step); };
  const begin = e => { if (e.type === 'keydown' && (e.repeat || !['Enter',' '].includes(e.key))) return; e.preventDefault(); t0 = performance.now(); cancelAnimationFrame(raf); raf = requestAnimationFrame(step); };

  ['pointerup','pointerleave','pointercancel','keyup','blur'].forEach(ev => btn.addEventListener(ev, end));
  btn.addEventListener('contextmenu', e => e.preventDefault());
})();

/* Written word under each picture. In the listening test (stage 3) only words that do not give away the answer are shown. */

  if (R.act === 'colors') {
    if (key === 'basket') return 'סל';
    if (isTarget) return COLORS[key].t;
    return test ? GARMENT_NAMES[R.garment] : COLORS[key].t;
  }
  if (R.act === 'animals') return test ? '' : ANIMALS[key].t;
  if (R.act === 'faces') return test || (R.kind === 'match' && !isTarget) ? '' : FEELINGS[key].t;
  if (isTarget) return SIZES[key].t;

/* size cells to the space available, so phone and tablet both fit without scrolling */

  const rows = $$('.row', stage); if (!rows.length) return;
  const cs = getComputedStyle(stage); const W = stage.clientWidth, H = stage.clientHeight - parseFloat(cs.paddingBottom || 0) - parseFloat(cs.paddingTop || 0), gap = Math.max(10, Math.min(22, W * .03));

  rows.forEach((row, i) => {
    const n = +row.dataset.n || 1, isT = row.classList.contains('targets');
    const aspect = isT ? (G.round.act === 'colors' && G.round.kind !== 'basket' ? 1.15 : (G.round.targets[0] && G.round.targets[0].wide ? .85 : 1.05)) : (G.round.aspect || 1.05);

}

/* ---------- input: tap, select-then-target, forgiving drag, keyboard ---------- */
function select(el) {

}

function tap(el) {
  const R = G.round; if (!R || G.busy || R.done) return;
  const isPiece = el.classList.contains('piece');
  if (R.kind === 'pop') return isPiece && popBalloon(el);
  if (R.kind === 'explore') return isPiece && touchFace(el);
  if (R.kind === 'choice' && isPiece) return attempt(el, null);
  if (R.kind === 'basket' && isPiece) return attempt(el, $('.target'));
  if (R.kind === 'basket' && !isPiece) { if (G.sel) attempt(G.sel, el); return; }
  /* matching: pick a piece, then a target */
  if (isPiece) { const was = G.sel === el; select(was && R.pieces.length > 1 ? null : el); if (G.sel && R.mode === 'learn' && R.kind !== 'sort') Sound.seq([itemWord(R, el.dataset.key)]); return; }

  ghost.animate([{ transform:'translate(0,0)' }, { transform:`translate(${r.left - g.left}px,${r.top - g.top}px)` }], { duration:S.anim === 'full' ? 320 : 180, easing:'ease-out' }).onfinish = () => ghost.remove();
}

  return new Promise(res => {

    const g = document.createElement('div'); g.className = 'ghost'; g.innerHTML = fromEl.querySelector('svg').outerHTML;
    Object.assign(g.style, { width:a.width + 'px', left:a.left + 'px', top:a.top + 'px' }); document.body.appendChild(g);

/* sizes stage 1: each item that lands in its pot says the pot's size word; after the last one, praise */

  const tk = targetEl.dataset.key; R.left--;

    const rest = $$('.piece').find(p => !p.classList.contains('gone')); R.target = rest.dataset.key;
    G.busy = false; await Sound.seq(['s_' + tk]); return;

    if (k === 'sizes') extra = `<div class="field"><span class="lab">פריטים</span><button class="btn small" data-all="sizes">כולם</button><div class="chips">${Object.entries(VEG).map(([c, v]) => chk('veg_' + c, v.t, a.veg.includes(c), `data-vocab="sizes" value="${c}"`)).join('')}</div></div><div class="field"><label for="siz_opt">גדלים</label><select id="siz_opt" data-act="sizes" data-f="options">${opt(2,'קטן / גדול',a.options)}${opt(3,'קטן / בינוני / גדול',a.options)}</select></div>`;
    return `<div class="act-box"><div class="act-title"><h3>${A.name}</h3><button class="btn small primary" data-play="${k}">להתחיל</button></div>
      <div class="field"><label for="stage_${k}">שלב</label><select id="stage_${k}" data-act="${k}" data-f="stage">${Object.keys(A.stages).map(n => opt(n, n + ' · ' + A.stages[n].n, a.stage)).join('')}</select>
      <span class="tag${st.mode === 'test' ? ' test' : ''}">${st.mode === 'test' ? 'בדיקת הבנה' : 'למידה'}</span></div>
      <p class="stage-desc">${st.d}</p>
      ${miss.length ? `<p class="note">לשלב הזה חסרה הקראה בעברית ל: ${miss.map(id => WORDS[id].t).join(', ')}. הוא לא יופעל עד שתהיה.</p>` : ''}
      ${extra}</div>`;
  }).join('');

  const recRows = [];
  for (const [k, A] of Object.entries(ACTS)) for (const stg of Object.keys(A.stages).filter(n => A.stages[n].listen).reverse()) {
    const s2 = REC[k] && REC[k][stg]; if (!s2) continue;
    for (const [w, v] of Object.entries(s2)) recRows.push(`<tr><td>${A.name}</td><td>${A.stages[stg].mode === 'test' ? 'בדיקה' : 'תרגול'}</td><td>${WORDS[w] ? WORDS[w].t : w}</td><td>${v.ind}</td><td>${v.retry}</td><td>${v.help}</td><td>${v.ind + v.retry + v.help}</td></tr>`);
  }
  const groups = {};
  Object.entries(WORDS).forEach(([id, w]) => (groups[w.group] = groups[w.group] || []).push(id));
  const fileRows = Object.entries(groups).map(([g, ids]) => `<details${g === 'צבעים' ? ' open' : ''}><summary>${g}</summary><div class="files">${ids.map(id => {
    const has = Sound.files.has(id), w = WORDS[id];
    const status = has ? '<span class="st-ok">קובץ שהועלה</span>' : (Sound.voice && w.say !== null ? 'קול המכשיר' : (w.optional ? 'אין (לא חובה)' : '<span class="st-miss">אין הקראה</span>'));
    return `<div class="frow"><span class="w">${w.t}</span><span class="st">${status}</span>
      <button class="btn small" data-hear="${id}">השמעה</button>
      <button class="btn small" data-up="${id}">${has ? 'החלפת קובץ' : 'העלאת קובץ'}</button>
      ${has ? `<button class="btn small quiet" data-rm="${id}">מחיקה</button>` : ''}</div>`;
  }).join('')}</div></details>`).join('');

  $('#setWrap').innerHTML = `
  <div class="set-head"><h1>הגדרות למבוגר</h1><button class="btn primary" id="backHome">חזרה למשחק</button></div>

  <section class="box"><h2>קריינות בעברית</h2>
    <p class="${Sound.voice ? 'st-ok' : ''}" style="font-weight:600">${s.why}</p>
    ${voiceBlock}
    <div class="field"><label for="rate">מהירות דיבור</label><input type="range" id="rate" min="0.6" max="1.1" step="0.05" value="${S.rate}"></div>
  </section>

  <section class="box"><h2>צלילים ותנועה</h2>
    <div class="field"><label for="vol">עוצמת קול</label><input type="range" id="vol" min="0" max="1" step="0.05" value="${S.volume}"></div>
    <div class="chips">${chk('o_narr', 'קריינות מילים', S.narration)}${chk('o_sfx', 'צלילי חיזוק ופיצוץ', S.sfx)}${chk('o_praise', 'חיזוק מילולי', S.praise)}${chk('o_animal', 'קולות חיות', S.animalSounds)}${chk('o_labels', 'מילה כתובה מתחת לתמונה', S.labels)}${chk('o_fx', 'בלון מתפוצץ עם הפתעות (במשחק הבלונים)', S.celebrate)}</div>
    <div class="field"><label for="praiseSel">משפט חיזוק</label><select id="praiseSel">${opt(-1, 'מתחלף: ' + PRAISES.slice(0, PRAISE_CYCLE).join(' › '), S.praiseIdx)}${PRAISES.map((p, i) => opt(i, 'תמיד ' + p, S.praiseIdx)).join('')}</select></div>
    <p class="hint-text">אחרי הצלחה, וגם אחרי כל פיצוץ בלון, נשמעת קודם המילה ורק אחריה צליל ומשפט החיזוק. בשלבי הלמידה, נגיעה בתמונה משמיעה את שמה. בשלב הבדיקה לא נכתבת מתחת לתמונות מילה שמסגירה את התשובה. קולות החיות מושמעים אחרי שם החיה. אם לא הועלה קובץ, נשמעת חיקוי מילולי (למשל "הב הב") בקול העברי.</p>
    <div class="field"><label for="animSel">אנימציות</label><select id="animSel">${opt('full','רגילות',S.anim)}${opt('reduced','מופחתות',S.anim)}${opt('off','כבויות',S.anim)}</select>
      <label for="rewSel">בלוני פרס (במשחק הבלונים)</label><select id="rewSel">${[0,1,3,5].map(n => opt(n, n === 0 ? 'בלי' : n, S.rewards)).join('')}</select></div>
  </section>

  <section class="box"><h2>פעילויות ושלבים</h2>
    <p class="hint-text">שלב 1 הוא למידה עם הדגמה ורמזים. שלב 3 הוא בדיקת הבנה משמיעה, בלי רמז חזותי לתשובה, ומיקום התשובה משתנה בין סבבים. המעבר בין שלבים נעשה רק כאן.</p>
    ${actBlocks}
  </section>

  <section class="box"><h2>סיכום סבבים</h2>
    <p class="hint-text">נשמר רק במכשיר הזה. "עצמאי" הוא סבב שנפתר בניסיון הראשון בלי רמז. סבב נכון אחד לא מוכיח הבנה: עם שתי אפשרויות יש סיכוי של חצי לנחש נכון. כדאי להסתכל על הרבה סבבים לאורך כמה ימים.</p>
    ${recRows.length ? `<div class="tblwrap"><table><thead><tr><th>פעילות</th><th>שלב</th><th>מילה</th><th>עצמאי</th><th>אחרי ניסיון נוסף</th><th>עם רמז/הדגמה</th><th>סה״כ</th></tr></thead><tbody>${recRows.join('')}</tbody></table></div>` : '<p>עדיין אין סבבים בשלבים 2–3.</p>'}
    <div><button class="btn small" id="resetRec">איפוס הסיכום</button></div>
  </section>

  <section class="box"><h2>קול של אדם אמיתי: הקלטות</h2>
    <p class="hint-text">כדי שהילד ישמע קול מוכר של אמא, אבא או מטפל, מקליטים כל מילה בטלפון (אפליקציית ההקלטות הרגילה) ונותנים לקובץ את שם המילה, למשל <b>שלוש</b>, <b>כלב</b>, <b>אדום</b>, <b>גדול</b>, <b>כל הכבוד</b>. אחר כך מעלים את כל הקבצים יחד, והמשחק מתאים כל קובץ למילה לפי השם. הקלטה מחליפה את קול המכשיר למילה הזו. הקבצים נשמרים רק בדפדפן הזה.${DB.db ? '' : ' <b>שימו לב: אחסון הקבצים לא זמין כאן, והם יישמרו רק עד סגירת הדף.</b>'}</p>
    <div class="chips"><button class="btn primary" id="bulkUp">העלאת כמה הקלטות יחד</button><button class="btn" id="copyList">העתקת רשימת המילים להקלטה</button></div>
    <p id="bulkMsg" class="note" aria-live="polite" hidden></p>
    <textarea id="wordList" readonly rows="3" style="width:100%;box-sizing:border-box;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:8px">${Object.entries(WORDS).filter(([id, w]) => !w.optional).map(([id, w]) => w.t).join(', ')}</textarea>
    ${fileRows}
  </section>

  <section class="box"><h2>פרטיות ואיפוס</h2>
    <p class="hint-text">אין חשבון, אין מצלמה או מיקרופון, ושום מידע לא נשלח לשום מקום. ההגדרות, הסיכום והקבצים נשמרים רק בדפדפן הזה.</p>
    <div class="chips"><button class="btn small" id="resetSet">איפוס הגדרות</button><button class="btn small" id="resetFiles">מחיקת כל קובצי הקול</button></div>
    <p id="resetMsg" class="hint-text" aria-live="polite"></p>
  </section>`;
}

const setWrap = $('#setWrap');
setWrap.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.f) { const v = t.dataset.f === 'order' ? t.value : +t.value; S.act[t.dataset.act][t.dataset.f] = v; }
  else if (t.dataset.vocab) {
    const a = S.act[t.dataset.vocab];
    const isVeg = t.dataset.vocab === 'sizes', list = isVeg ? a.veg : a.vocab;
    const set2 = new Set(list); t.checked ? set2.add(t.value) : set2.delete(t.value);
    if (set2.size < (isVeg ? 1 : 2)) { t.checked = true; flash(t, isVeg ? 'צריך לפחות פריט אחד' : 'צריך לפחות שתי אפשרויות'); return; }
    const ordered = Object.keys(isVeg ? VEG : t.dataset.vocab === 'colors' ? COLORS : t.dataset.vocab === 'faces' ? FEELINGS : ANIMALS).filter(k => set2.has(k));
    if (isVeg) a.veg = ordered; else a.vocab = ordered;
  }
  else if (t.id === 'voiceSel') { S.voiceURI = t.value; Sound.pick(); }
  else if (t.id === 'o_narr') S.narration = t.checked;
  else if (t.id === 'o_sfx') S.sfx = t.checked;
  else if (t.id === 'o_praise') S.praise = t.checked;
  else if (t.id === 'o_animal') S.animalSounds = t.checked;
  else if (t.id === 'o_labels') S.labels = t.checked;
  else if (t.id === 'o_fx') S.celebrate = t.checked;
  else if (t.id === 'fac_story') S.act.faces.stories = t.checked;
  else if (t.id === 'fac_say') S.act.faces.sayStory = t.checked;
  else if (t.id === 'col_auto') { S.act.colors.auto = t.checked; if (t.checked) { S.act.colors.vocab = ['red','blue']; S.act.colors.progress = 0; } }
  else if (t.id === 'col_need') { S.act.colors.need = +t.value; }
  else if (t.id === 'praiseSel') S.praiseIdx = +t.value;
  else if (t.id === 'animSel') { S.anim = t.value; document.documentElement.className = 'anim-' + S.anim; }
  else if (t.id === 'rewSel') S.rewards = +t.value;
  else if (t.id === 'vol') S.volume = +t.value;
  else if (t.id === 'rate') S.rate = +t.value;
  else return;
  saveS();
  if (!['vol','rate'].includes(t.id)) { const y = $('#settings').scrollTop; renderSettings(); $('#settings').scrollTop = y; const again = t.id && $('#' + t.id); if (again) again.focus(); }
});
function flash(el, msg) { const l = el.closest('.act-box') || el.closest('section'); let n = l.querySelector('.flashmsg'); if (!n) { n = document.createElement('p'); n.className = 'note flashmsg'; l.appendChild(n); } n.textContent = msg; }
let upId = null;
setWrap.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'backHome') { show('home'); return; }
  if (b.dataset.all) { const a = S.act[b.dataset.all]; if (b.dataset.all === 'sizes') a.veg = Object.keys(VEG); else a.vocab = Object.keys(b.dataset.all === 'faces' ? FEELINGS : ANIMALS); saveS(); keepScroll(renderSettings); return; }
  if (b.id === 'bulkUp') { $('#bulkPick').value = ''; $('#bulkPick').click(); return; }
  if (b.id === 'copyList') { const txt = $('#wordList').value; try { await navigator.clipboard.writeText(txt); b.textContent = 'הועתק'; } catch (_) { $('#wordList').select(); } return; }
  if (b.dataset.play) { show('game'); startActivity(b.dataset.play); return; }
  if (b.id === 'testVoice') { Sound.unlock(); Sound.seq(['c_red', 300, 'n2', 300, 'a_dog']); return; }
  if (b.dataset.hear) { Sound.unlock(); const id = b.dataset.hear;
    const was = S.narration; S.narration = true; await Sound.seq([id]); S.narration = was; return; }
  if (b.dataset.up) { upId = b.dataset.up; $('#filePick').value = ''; $('#filePick').click(); return; }
  if (b.dataset.rm) { const id = b.dataset.rm; await DB.del(id); const u = Sound.files.get(id); if (u) URL.revokeObjectURL(u); Sound.files.delete(id); keepScroll(renderSettings); return; }
  if (b.id === 'resetRec') { REC = {}; saveR(); keepScroll(renderSettings); return; }
  if (b.id === 'resetSet') { S = clone(DEFAULTS); saveS(); Sound.pick(); document.documentElement.className = 'anim-' + S.anim; keepScroll(renderSettings); $('#resetMsg').textContent = 'ההגדרות חזרו לברירת המחדל.'; return; }
  if (b.id === 'resetFiles') { await DB.clear(); Sound.files.forEach(u => URL.revokeObjectURL(u)); Sound.files.clear(); keepScroll(renderSettings); $('#resetMsg').textContent = 'כל קובצי הקול נמחקו.'; return; }
});
function keepScroll(fn) { const y = $('#settings').scrollTop; fn(); $('#settings').scrollTop = y; }
$('#filePick').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; if (!f || !upId) return;
  if (!/^audio\//.test(f.type) && !/\.(mp3|m4a|wav|ogg|aac|webm|opus)$/i.test(f.name)) return;
  await DB.put(upId, f);
  const old = Sound.files.get(upId); if (old) URL.revokeObjectURL(old);
  Sound.files.set(upId, URL.createObjectURL(f));
  keepScroll(renderSettings);
});

/* match many recordings to words by file name: "שלוש.m4a", "3.mp3", "כל הכבוד.wav" */
const normName = t => String(t).replace(/\.[^.]+$/, '').replace(/[\u0591-\u05C7]/g, '').replace(/[_\-]+/g, ' ').replace(/[׳']/g, "'").replace(/\s+/g, ' ').trim();
$('#bulkPick').addEventListener('change', async e => {
  const files = [...(e.target.files || [])]; if (!files.length) return;
  const index = new Map();
  Object.entries(WORDS).forEach(([id, w]) => { index.set(normName(w.t), id); index.set(id, id); });
  NUM_WORDS.forEach((_, i) => index.set(String(i + 1), 'n' + (i + 1)));
  const ok = [], miss = [];
  for (const f of files) {
    const id = index.get(normName(f.name));
    if (!id) { miss.push(f.name); continue; }
    await DB.put(id, f); const old = Sound.files.get(id); if (old) URL.revokeObjectURL(old);
    Sound.files.set(id, URL.createObjectURL(f)); ok.push(WORDS[id].t);
  }
  keepScroll(renderSettings);
  const m = $('#bulkMsg'); m.hidden = false;
  m.innerHTML = (ok.length ? `הותאמו ${ok.length} הקלטות: ${ok.join(', ')}.` : 'לא הותאמה אף הקלטה.') + (miss.length ? `<br>לא זוהו לפי השם: ${miss.join(', ')}. שם הקובץ צריך להיות בדיוק המילה, למשל "שלוש".` : '');
});

/* ================= boot ================= */
function refreshVoiceUI() {
  const s = speakStatus();
  const line = $('#startVoiceLine');
  const tb = $('#testSoundBtn'); if (tb) tb.hidden = !(Sound.voice || Sound.files.has('n3'));
  if (line) line.innerHTML = Sound.voice ? `<b>${s.why}</b>`
    : (Sound.voicesChecked || !Sound.supported ? `<b>${s.why}</b> אפשר לשחק בשלבי הלמידה. להפעלת הקראה ראו "הגדרות למבוגר" במסך הבא.` : 'בודק קריינות בעברית…');
  if (!$('#settings').hidden) keepScroll(renderSettings);
}
$('#startBtn').addEventListener('click', () => { Sound.unlock(); show('home'); });
$('#testSoundBtn').addEventListener('click', () => { Sound.unlock(); Sound.seq(['n3']); });
(async function boot() {
  document.documentElement.className = 'anim-' + S.anim;
  renderHome();
  if (await DB.open()) {
    for (const [k, v] of await DB.all()) { try { Sound.files.set(k, URL.createObjectURL(v)); } catch (e) {} }
  }
  Sound.initVoices();
  refreshVoiceUI();
})();
</script>

<script>
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
